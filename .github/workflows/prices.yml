name: Prices

# Every hour: read the WoW: Forever auction houses from Blizzard's API, record
# what was bought, update the price history and trending lists, and publish a
# GitHub Release with Cutpurse Ledger + fresh prices.
#
# Blizzard refreshes the houses around :23. GitHub's own scheduler is "best
# effort" and drops many runs when Actions is busy, so the feed keeps itself
# going: every run ends by waiting until :35 of the next hour and starting the
# next run (unless another run is already waiting). The schedule below is only
# a safety net that restarts the chain if it ever breaks; a scheduled run does
# nothing if a release went out in the last 45 minutes.
on:
  schedule:
    - cron: "40 * * * *"
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      curseforge:
        description: "Also upload these prices to CurseForge now"
        type: boolean
        default: false

permissions:
  contents: read   # raised for the prices job only, below

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  # Every release ships the addon from main too: test it (and its Lua syntax) first,
  # so a broken commit can't reach players through the hourly release. A job of its
  # own, with a read-only token and no secrets: `npm ci` runs code from npm packages,
  # which must never run where the write token and the API keys are.
  # It also decides whether this run has anything to do (scheduled runs only).
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.fresh.outputs.skip }}
    steps:
      - name: Skip if a fresh release exists
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Newest by publish time (createdAt is the tagged commit's date, see Prune below)
          last=$(gh release list -R "${{ github.repository }}" --limit 100 --json publishedAt --jq 'map(.publishedAt) | max // empty' || true)
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt 2700 ]; then
            echo "Last release $last is under 45 minutes old: nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.fresh.outputs.skip != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.skip != 'true'
        with:
          node-version: 24

      - name: Addon tests
        if: steps.fresh.outputs.skip != 'true'
        run: |
          npm ci --no-audit --no-fund
          node --test tests/*.test.mjs
          node -e '
            const fs = require("fs"), path = require("path"), luaparse = require("luaparse");
            const toc = fs.readFileSync("addon/LootLedger/LootLedger.toc", "utf8").split(/\r?\n/).filter((l) => l.endsWith(".lua"));
            for (const f of toc) luaparse.parse(fs.readFileSync(path.join("addon/LootLedger", ...f.split("\\")), "utf8"), { luaVersion: "5.1" });
            console.log("Lua syntax ok:", toc.length, "files");'

  prices:
    needs: tests
    # Runs even when the tests failed or were cancelled: its last step starts the next
    # run, and the hourly chain must never break. The feed, history and release steps
    # only run when the tests passed and there is something to do (FEED).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120   # the work takes ~5 minutes; the rest is waiting for the next hour
    permissions:
      contents: write
      actions: write   # lets a run start the next one, and keep the schedule switched on
    # The write token (git push, releases, starting runs) goes only to the steps that
    # need it, not to the ones running the feed or its tests.
    env:
      KEEP_RELEASES: 48
      FEED: ${{ needs.tests.result == 'success' && needs.tests.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: env.FEED == 'true'
        with:
          persist-credentials: false   # no write token left in .git/config for the feed's own steps
      - uses: actions/setup-node@v4
        if: env.FEED == 'true'
        with:
          node-version: 24

      # The feed's own tests need no packages (no npm here: see the tests job).
      - name: Tests
        if: env.FEED == 'true'
        run: node --test poller/*.test.mjs

      - name: Get previous history
        if: env.FEED == 'true'
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        # No history branch yet (ls-remote exit 2): start empty. Any other failure stops
        # the run, so a network hiccup never replaces the real history with an empty one.
        run: |
          set +e
          git ls-remote --quiet --exit-code --heads "$REPO_URL" history > /dev/null
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "No history branch yet: starting empty."
            mkdir -p history
          elif [ "$code" -ne 0 ]; then
            echo "::error::Could not read the history branch (git ls-remote exit $code)"
            exit 1
          else
            git clone --quiet --depth 1 --branch history "$REPO_URL" history
            # Don't leave the token in history/.git/config for the steps that run the feed.
            git -C history remote set-url origin "https://github.com/${{ github.repository }}.git"
          fi

      - name: Fetch auction houses
        if: env.FEED == 'true'
        run: node poller/ah.mjs
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          BNET_REGION: ${{ vars.BNET_REGION || 'eu' }}
          AH_RULESET: ${{ vars.AH_RULESET || '2' }}
          AH_HOUSES: ${{ vars.AH_HOUSES || 'all' }}
          ARCHIVE_HOUSES: ${{ vars.ARCHIVE_HOUSES || '114' }}   # hourly prices kept 35 days (poller/archive.mjs)

      # History lives on its own branch, replaced every run (one commit, so the repo doesn't grow).
      - name: Keep history
        if: env.FEED == 'true'
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          cd out/history
          git init --quiet --initial-branch history
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "history $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force "$REPO_URL" history

      - name: Build zip
        if: env.FEED == 'true'
        id: build
        run: |
          version=$(sed -n 's/^## Version: *//p' addon/LootLedger/LootLedger.toc | tr -d '\r')
          stamp=$(date -u +%Y%m%d%H%M)
          mkdir -p dist/pkg
          cp -r addon/LootLedger out/LootLedger_Prices dist/pkg/
          (cd dist/pkg && zip -qr "../CutpurseLedger-$version-$stamp.zip" LootLedger LootLedger_Prices)
          echo "tag=v$version-$stamp" >> "$GITHUB_OUTPUT"
          echo "title=Cutpurse Ledger $version · prices $(date -u '+%Y-%m-%d %H:%M') UTC" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: env.FEED == 'true'
        # Tag and title come in as variables, not pasted into the script: the version
        # in them is read from a file. The tag must look like v3.15.0-202611281235.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          TITLE: ${{ steps.build.outputs.title }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9.]+-[0-9]{12}$ ]]; then echo "::error::Unexpected release tag: $TAG"; exit 1; fi
          gh release create "$TAG" dist/CutpurseLedger-*.zip \
            --title "$TITLE" \
            --notes "Cutpurse Ledger with auction house prices from $(date -u '+%Y-%m-%d %H:%M') UTC. Install or update both folders (LootLedger and LootLedger_Prices) into Interface/AddOns of your _forever_ folder." \
            --latest

      # CurseForge gets the price addon every 6 hours (00, 06, 12, 18 UTC), or when asked.
      # Decided by the hour alone: chain runs are workflow_dispatch, not schedule.
      # A CurseForge failure must not stop the steps after it.
      - name: Upload prices to CurseForge
        continue-on-error: true
        if: env.FEED == 'true'
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          FORCE: ${{ inputs.curseforge }}
        run: |
          hour=$(date -u +%H)
          if [ "$FORCE" != "true" ] && [ $((10#$hour % 6)) -ne 0 ]; then echo "Not a CurseForge hour ($hour UTC)"; exit 0; fi
          if [ -z "$CF_API_KEY" ]; then echo "No CF_API_KEY secret, skipping"; exit 0; fi
          stamp=$(date -u '+%Y-%m-%d %H:%M')
          (cd dist/pkg && zip -qr "../CutpurseLedgerPrices-EU-$(date -u +%Y%m%d%H%M).zip" LootLedger_Prices)
          node poller/curseforge.mjs --project 1825560 --file dist/CutpurseLedgerPrices-EU-*.zip \
            --name "Prices $stamp UTC" --changelog "Auction house prices for every EU WoW: Forever auction house, $stamp UTC."

      - name: Prune old releases
        if: env.FEED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # publishedAt, not createdAt: createdAt is the date of the tagged commit, the
          # same for every release of one version, so sorting by it can delete the newest.
          gh release list --limit 300 --json tagName,publishedAt \
            --jq "sort_by(.publishedAt) | reverse | .[${KEEP_RELEASES}:] | .[].tagName" |
          while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done

      # GitHub switches off schedules in public repos after 60 days without repository
      # activity. Re-enabling the workflow once a day resets that clock, so the price
      # feed never stops just because nobody pushed code for a while.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "03" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/prices.yml/enable" && echo "schedule refreshed"
          fi

      # Keep the feed going without relying on GitHub's scheduler: wait until :35
      # of the next hour (Blizzard has refreshed by then), then start the next run.
      # Runs even if this one failed, so one bad hour doesn't break the chain.
      # Skipped if another run is already waiting, so there is only ever one chain.
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          now=$(date -u +%s)
          target=$(( now / 3600 * 3600 + 35 * 60 ))
          if [ "$target" -le $(( now + 120 )) ]; then target=$(( target + 3600 )); fi
          echo "Next run at $(date -u -d "@$target" +%H:%M) UTC (waiting $(( (target - now) / 60 )) min)"
          sleep $(( target - now ))
          others=$(gh run list -R "${{ github.repository }}" --workflow prices.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != $RUN_ID and (.status == \"queued\" or .status == \"in_progress\" or .status == \"pending\" or .status == \"waiting\" or .status == \"requested\"))] | length" || true)
          # If the list failed, assume no other run: a second chain is better than none.
          if [ "${others:-0}" != "0" ]; then echo "Another run is already waiting ($others): it carries on the chain."; exit 0; fi
          gh workflow run prices.yml -R "${{ github.repository }}" --ref main
          echo "Started the next run."
